<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>How the solver answers a spec</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142; padding: 3rem 2rem; }
.frame { max-width: 1040px; margin: 0 auto; }
.diagram-container { width: 100%; overflow-x: auto; }
svg { width: 100%; min-width: 960px; display: block; }
svg a:hover text { fill: #2e5aa8; }
.eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; font-size: .66rem; font-weight: 500; letter-spacing: .18em;
  text-transform: uppercase; color: #4f5d75; margin-bottom: .5rem; }
.eyebrow a { color: #4f5d75; }
h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + .75rem, 2rem); font-weight: 400;
  letter-spacing: -.02em; line-height: 1.15; margin-bottom: 1.5rem; }
h2 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.35rem; margin: 2rem 0 .75rem; }
dl { display: grid; grid-template-columns: 11rem 1fr; gap: .55rem 1.25rem; font-size: .9rem;
  border-top: 1px solid rgba(45,49,66,.12); padding-top: 1rem; }
dt { font-family: 'Geist Mono', ui-monospace, monospace; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
  color: #4f5d75; padding-top: .15rem; }
dd { line-height: 1.5; }
code, .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-size: .82rem; }
a { color: #2e5aa8; text-decoration: none; } a:hover { text-decoration: underline; }
.muted { color: #4f5d75; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; }
th { text-align: left; font-family: 'Geist Mono', ui-monospace, monospace; font-size: .66rem; letter-spacing: .14em;
  text-transform: uppercase; color: #4f5d75; font-weight: 500; padding: .5rem .5rem;
  border-bottom: 1px solid rgba(45,49,66,.25); }
td { padding: .4rem .5rem; border-bottom: 1px solid rgba(45,49,66,.08); vertical-align: top; }
td.num { font-family: 'Geist Mono', ui-monospace, monospace; text-align: right; }
input { font: inherit; font-size: .9rem; padding: .45rem .7rem; border: 1px solid rgba(45,49,66,.25);
  border-radius: 6px; background: #fff; width: min(24rem, 100%); margin-bottom: 1rem; }
.overviews { display: grid; grid-template-columns: 1.1fr 1fr .9fr; gap: 12px; margin-bottom: 2rem; }
.overviews a { display: block; background: #fff; border: 1px solid rgba(45,49,66,.12); border-radius: 6px;
  padding: .9rem 1rem; color: #2d3142; }
.overviews a:hover { border-color: #2d3142; text-decoration: none; }
.overviews b { display: block; font-weight: 600; margin-bottom: .25rem; }
.overviews span { font-size: .82rem; color: #4f5d75; }
@media (max-width: 720px) { dl { grid-template-columns: 1fr; } .overviews { grid-template-columns: 1fr; } }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
