<line x1="40" y1="652" x2="920" y2="652" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
<text x="40" y="689" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Oval = start or answer · Rectangle = step · Diamond = decision</text>
<text x="40" y="708" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Q1 = “can I take X?”, Q2 = “plan my semesters”. Code: solver/run.py, spec.py, q1.py, model.py, q2.py, explain.py.</text></svg>
