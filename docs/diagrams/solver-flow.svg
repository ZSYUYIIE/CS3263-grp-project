<rect x="408" y="211" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="420" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
