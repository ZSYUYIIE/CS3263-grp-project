[project]
name = "cs3263-project"
version = "1.0.0"
description = "LLM vs constraint solver for NUS degree plans (CS3263, AY2026/27)"
requires-python = ">=3.10"
dependencies = ["ortools>=9.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, import order, modern syntax
select = ["E", "F", "W", "B", "I", "UP"]
# zip(strict=...) would change behaviour on unequal lengths; not worth it here
ignore = ["B905"]

[tool.ruff.lint.isort]
known-first-party = ["m1_data", "solver", "experiments"]
